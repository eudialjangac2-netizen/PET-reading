<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Bài Tập - PET Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', 'Product Sans', Roboto, sans-serif;
    background: #f7f5f0;
    color: #2d2a24;
    min-height: 100vh;
  }

  .page-header {
    position: relative;
    background: #faf3e8;
    background-image:
      radial-gradient(circle at 12% 20%, rgba(255,255,255,0.9) 0, rgba(255,255,255,0) 42%),
      radial-gradient(circle at 88% 15%, rgba(212,160,23,0.10) 0, rgba(212,160,23,0) 45%),
      radial-gradient(circle at 50% 100%, rgba(107,59,167,0.06) 0, rgba(107,59,167,0) 50%);
    padding: 34px 20px 30px;
    text-align: center;
    color: #4a3a2e;
    border-bottom: 1px solid #ecdfc9;
  }
  .mascot-row {
    display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .mascot-row img {
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover;
    border: 3px solid white; box-shadow: 0 4px 10px rgba(74,58,46,0.12);
  }
  .page-header h1 { font-size: 25px; font-weight: 700; margin-bottom: 6px; color: #4a3a2e; }
  .page-header p { font-size: 14px; color: #8a7b68; }

  .toolbar {
    max-width: 1000px; margin: -20px auto 0; padding: 0 20px;
    position: relative; z-index: 5;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }

  .search-box { max-width: 420px; width: 100%; }
  .search-box input {
    width: 100%; padding: 13px 20px; border-radius: 30px; border: none;
    font-family: inherit; font-size: 15px; outline: none; background: white;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .filter-chip {
    background: white; border: 2px solid #e5e0d5; border-radius: 30px;
    padding: 9px 18px; font-size: 13.5px; font-weight: 700; color: #6b6558;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: all 0.15s;
  }
  .filter-chip:hover { border-color: #bbb; }
  .filter-chip.active { background: #2d2a24; color: white; border-color: #2d2a24; }

  .content-area { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }

  .part-group { margin-bottom: 36px; }
  .part-group-title {
    font-size: 17px; font-weight: 700; color: #4a4538; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .part-group-title .count {
    color: white; font-size: 12.5px; padding: 3px 12px; border-radius: 20px; font-weight: 700;
  }
  .part-group-title .line { flex: 1; height: 2px; background: #e5e0d5; border-radius: 2px; }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
  }

  .exercise-card {
    background: white; border-radius: 22px; overflow: hidden;
    border: 2px solid var(--card-border, #eee); box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
  }

  .card-banner {
    height: 100px; background: var(--card-bg, #f0f0f0);
    display: flex; align-items: center; justify-content: center;
  }
  .card-banner img {
    width: 68px; height: 68px; border-radius: 16px; object-fit: cover;
    border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--card-primary, #333); line-height: 1.3; }
  .card-mascot-name { font-size: 12px; color: #999; font-weight: 600; margin-bottom: 8px; }

  .card-actions { margin-top: auto; display: flex; gap: 8px; }
  .card-btn {
    flex: 1; border: none; border-radius: 12px; padding: 9px 8px; font-family: inherit;
    font-weight: 700; font-size: 12.5px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 4px; transition: all 0.15s; text-decoration: none;
  }
  .card-btn-open { background: var(--card-primary, #333); color: white; }
  .card-btn-open:hover { filter: brightness(1.1); }
  .card-btn-copy { background: #f3f1ea; color: #4a4538; border: 2px solid #e5e0d5; }
  .card-btn-copy:hover { border-color: #bbb; }
  .card-btn-copy.copied { background: #2e9b5f; color: white; border-color: #2e9b5f; }

  .empty-state, .loading-state { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
  .empty-state .emoji { font-size: 46px; margin-bottom: 12px; }

  #toast {
    visibility: hidden; min-width: 260px; max-width: 90vw; background: #2d2a24; color: white;
    text-align: center; border-radius: 14px; padding: 14px 22px; position: fixed; z-index: 999;
    left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14.5px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, bottom 0.3s;
  }
  #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
</style>
</head>
<body>

  <div id="toast"></div>

  <div class="page-header">
    <div class="mascot-row" id="mascotRow"></div>
    <h1>📚 Kho Bài Tập PET Reading</h1>
    <p>Chọn 1 bài để giao cho học sinh, hoặc copy link gửi trực tiếp</p>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Tìm theo tên bài hoặc Part...">
    </div>
    <div class="filter-bar" id="filterBar"></div>
  </div>

  <div class="content-area" id="contentArea">
    <div class="loading-state">Đang tải danh sách bài tập...</div>
  </div>

  <script src="theme-config.js"></script>
  <script>
    const PART_LABELS = {
      part1: "Part 1", part2: "Part 2", part3: "Part 3",
      part4: "Part 4", part5: "Part 5", part6: "Part 6",
    };

    let allExercises = []; // { id, exerciseName, partType }
    let activeFilter = "all";

    const contentEl = document.getElementById("contentArea");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.innerHTML = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    // ---- Tải manifest (chỉ là mảng id) rồi đọc trực tiếp exerciseName/partType
    //      từ chính file JSON của từng bài — không lưu trùng lặp trong manifest ----
    async function loadAllExercises() {
      let ids = [];
      try {
        const manifestRes = await fetch("exercises-manifest.json");
        ids = await manifestRes.json();
      } catch (err) {
        console.error("Không tải được exercises-manifest.json:", err);
        return [];
      }

      const results = await Promise.all(ids.map(async (id) => {
        try {
          const res = await fetch(`exercises/${id}.json`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          return { id: data.id || id, exerciseName: data.exerciseName, partType: data.partType };
        } catch (err) {
          console.warn("⚠️ Bỏ qua bài lỗi:", id, err);
          return null;
        }
      }));

      return results.filter(Boolean);
    }

    function buildExerciseUrl(id) {
      const base = window.location.href.replace(/kho-bai-tap-doc\.html.*$/, "");
      return base + "bai-tap-doc.html?id=" + encodeURIComponent(id);
    }

    function copyLink(id, btn) {
      const url = buildExerciseUrl(id);
      navigator.clipboard.writeText(url).then(() => {
        const oldHTML = btn.innerHTML;
        btn.innerHTML = "✅ Đã copy!";
        btn.classList.add("copied");
        showToast("🔗 Đã copy link bài tập!");
        setTimeout(() => { btn.innerHTML = oldHTML; btn.classList.remove("copied"); }, 1800);
      }).catch(() => {
        showToast("⚠️ Không thể tự động copy. Link bài: " + url);
      });
    }
    window.copyLink = copyLink;

    function renderFilterBar() {
      const partTypesPresent = [...new Set(allExercises.map(e => e.partType))].sort();
      const bar = document.getElementById("filterBar");
      const chips = [{ key: "all", label: "Tất cả" }].concat(
        partTypesPresent.map(pt => ({ key: pt, label: PART_LABELS[pt] || pt }))
      );
      bar.innerHTML = chips.map(c => `
        <div class="filter-chip ${c.key === activeFilter ? "active" : ""}" data-filter="${c.key}">${c.label}</div>
      `).join("");
      bar.querySelectorAll(".filter-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          activeFilter = chip.getAttribute("data-filter");
          renderFilterBar();
          renderContent();
        });
      });
    }

    function renderCard(ex) {
      const theme = (typeof getThemeByPartType === "function") ? getThemeByPartType(ex.partType) : null;
      const primary = theme ? theme.primary : "#333";
      const bg = theme ? theme.bgMain : "#f0f0f0";
      const border = theme ? theme.borderColor : "#eee";
      const avatar = theme ? theme.avatarImg : "";
      const mascotName = theme ? theme.mascot : "";

      return `
        <div class="exercise-card" style="--card-primary:${primary}; --card-bg:${bg}; --card-border:${border};">
          <div class="card-banner">
            ${avatar ? `<img src="${avatar}" alt="${mascotName}">` : ""}
          </div>
          <div class="card-body">
            <div class="card-title">${ex.exerciseName}</div>
            <div class="card-mascot-name">${mascotName}</div>
            <div class="card-actions">
              <a class="card-btn card-btn-open" href="bai-tap-doc.html?id=${ex.id}" target="_blank" rel="noopener">▶️ Mở bài</a>
              <button class="card-btn card-btn-copy" onclick="copyLink('${ex.id}', this)">🔗 Copy link</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderContent() {
      const query = document.getElementById("search-input").value.trim().toLowerCase();

      let filtered = allExercises.filter(ex =>
        ex.exerciseName.toLowerCase().includes(query) ||
        (PART_LABELS[ex.partType] || ex.partType).toLowerCase().includes(query) ||
        ex.id.toLowerCase().includes(query)
      );

      if (activeFilter !== "all") {
        filtered = filtered.filter(ex => ex.partType === activeFilter);
      }

      if (filtered.length === 0) {
        const msg = allExercises.length === 0
          ? "Kho dữ liệu đang trống. Hãy thêm file bài tập vào thư mục <b>exercises/</b> và khai báo trong <b>exercises-manifest.json</b>."
          : "Không tìm thấy bài tập phù hợp.";
        contentEl.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>${msg}</div>`;
        return;
      }

      // Gom nhóm theo Part (vì giao bài lẻ theo từng Part, chưa giao trọn bộ Test)
      const groups = {};
      filtered.forEach(ex => {
        if (!groups[ex.partType]) groups[ex.partType] = [];
        groups[ex.partType].push(ex);
      });

      const partOrder = Object.keys(groups).sort();

      contentEl.innerHTML = partOrder.map(partType => {
        const theme = (typeof getThemeByPartType === "function") ? getThemeByPartType(partType) : null;
        const primary = theme ? theme.primary : "#4a4538";
        const label = PART_LABELS[partType] || partType;
        return `
          <div class="part-group">
            <div class="part-group-title">
              ${label}
              <span class="count" style="background:${primary};">${groups[partType].length} bài</span>
              <span class="line"></span>
            </div>
            <div class="card-grid">
              ${groups[partType].map(ex => renderCard(ex)).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    async function init() {
      renderMascotRow();
      allExercises = await loadAllExercises();
      renderFilterBar();
      document.getElementById("search-input").addEventListener("input", renderContent);
      renderContent();
    }

    function renderMascotRow() {
      const row = document.getElementById("mascotRow");
      if (typeof PET_THEMES !== "object") return;
      const order = ["part1", "part2", "part3", "part4", "part5", "part6"];
      row.innerHTML = order
        .filter(key => PET_THEMES[key])
        .map(key => `<img src="${PET_THEMES[key].avatarImg}" alt="${PET_THEMES[key].mascot}">`)
        .join("");
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
